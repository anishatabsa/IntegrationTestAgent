[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aita"
version = "0.1.0"
description = "AI Integration Test Agent — generates, heals, and learns from integration tests"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",

    # Async task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # CLI
    "typer[all]>=0.12.3",
    "rich>=13.7.1",

    # AI / LLM
    "anthropic>=0.28.0",
    "ollama>=0.2.1",
    "llama-index>=0.10.43",
    "llama-index-vector-stores-qdrant>=0.2.8",
    "llama-index-llms-anthropic>=0.1.15",
    "llama-index-llms-ollama>=0.1.5",
    "llama-index-embeddings-ollama>=0.1.3",
    "qdrant-client>=1.9.1",

    # Graph RAG (optional)
    "neo4j>=5.20.0",

    # Spec parsing
    "pyyaml>=6.0.1",
    "grpcio-tools>=1.64.0",
    "openapi-spec-validator>=0.7.1",

    # Git
    "gitpython>=3.1.43",

    # Docker
    "docker>=7.0.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "xxhash>=3.4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[project.scripts]
aita = "aita.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aita"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
